# Restarts VMs that opted in (label demo.example.com/auto-restart=true) when a change cannot be applied live:
# - Harvester reports RestartRequired (e.g. a memory decrease or growth past the hot-plug maximum), or
# - the live migration KubeVirt uses to hot-plug CPU/memory is stuck for 5+ minutes. This is always the case on
#   single-node clusters (the migration target cannot be scheduled next to the source); multi-node clusters
#   finish the hot-plug live in seconds and never hit this fallback.
# Changes are merged inside the maintenance window (scheduled-merge workflow), so restarts happen there too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-auto-restart
  namespace: vm-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-auto-restart
  namespace: vm-demo
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/restart"]
    verbs: ["update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstancemigrations"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-auto-restart
  namespace: vm-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-auto-restart
subjects:
  - kind: ServiceAccount
    name: vm-auto-restart
    namespace: vm-demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vm-auto-restart
  namespace: vm-demo
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: vm-auto-restart
          restartPolicy: Never
          containers:
            - name: restart
              image: docker.io/rancher/kuberlr-kubectl:v8.1.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  for vm in $(kubectl -n vm-demo get vm -l demo.example.com/auto-restart=true -o name); do
                    name=${vm#*/}
                    rr=$(kubectl -n vm-demo get vm "$name" -o jsonpath='{.status.conditions[?(@.type=="RestartRequired")].status}')
                    reason=""
                    if [ "$rr" = "True" ]; then reason="change needs a restart"; fi
                    # hot-plug migrations that never started (no target node) for 5+ minutes
                    for m in $(kubectl -n vm-demo get vmim -o jsonpath="{range .items[?(@.spec.vmiName==\"$name\")]}{.metadata.name}={.status.phase}={.metadata.creationTimestamp}{\"\\n\"}{end}"); do
                      phase=$(echo "$m" | cut -d= -f2)
                      created=$(echo "$m" | cut -d= -f3 | sed 's/T/ /; s/Z//')
                      age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
                      case "$phase" in Pending|Scheduling)
                        if [ "$age" -ge 300 ]; then
                          kubectl -n vm-demo delete vmim "${m%%=*}"
                          reason="hot-plug migration stuck in $phase for ${age}s (no target node)"
                        fi ;;
                      esac
                    done
                    if [ -n "$reason" ]; then
                      echo "restarting $name: $reason"
                      echo '{}' | kubectl replace --raw "/apis/subresources.kubevirt.io/v1/namespaces/vm-demo/virtualmachines/$name/restart" -f -
                    fi
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
