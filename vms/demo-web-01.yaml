# Demo VM for the "Resize VMs through GitOps" video (disaster-recovery cluster, 3 nodes, so hot-plug finishes live).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: demo-web-01
  namespace: demo
  labels:
    demo.example.com/tier: web
    demo.example.com/owner: team-web
    demo.example.com/cost-center: "cc-1001"
  annotations:
    # CPU (sockets) and memory increases are hot-plugged into the running VM, no reboot (up to 4x the boot size)
    harvesterhci.io/enableCPUAndMemoryHotplug: "true"
    harvesterhci.io/volumeClaimTemplates: '[{"metadata":{"name":"demo-web-01-rootdisk","annotations":{"harvesterhci.io/imageId":"default/image-d8ngv"}},"spec":{"accessModes":["ReadWriteMany"],"resources":{"requests":{"storage":"5Gi"}},"volumeMode":"Block","storageClassName":"lh-51c27bca-935d-40a7-842e-a2f59561bc80"}}]'
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        harvesterhci.io/vmName: demo-web-01
    spec:
      evictionStrategy: LiveMigrateIfPossible
      domain:
        cpu:
          cores: 1
          sockets: 2
          threads: 1
          maxSockets: 8
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
              macAddress: 02:de:73:00:00:01
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: demo-web-01-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              packages: [qemu-guest-agent]
              runcmd:
                - systemctl enable --now qemu-guest-agent
