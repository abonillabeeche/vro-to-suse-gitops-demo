# cloud-init userdata shared by all demo VMs: registers the guest with SUSE Multi-Linux Manager.
# The activation key (repos/channels + Salt config channels) is baked into the bootstrap script.
apiVersion: v1
kind: Secret
metadata:
  name: suma-bootstrap
  namespace: vm-demo
type: Opaque
stringData:
  userdata: |
    #cloud-config
    runcmd:
      - curl -Sf https://suma.example.com/pub/bootstrap/bootstrap-harvester.sh | /bin/bash
