# First boot of WordPress VMs: install the Salt minion from the distribution, point it at SUSE Multi-Linux
# Manager with activation key 1-wordpress (which assigns the SLES 16.1 channels and the "wordpress" state
# channel), then hand package management to the server: distribution repos off, vendor change allowed
# (openSUSE Leap 16.1 consuming SLES 16.1 channels, same code base).
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-cloudinit
  namespace: vm-demo
type: Opaque
stringData:
  userdata: |
    #cloud-config
    write_files:
      - path: /etc/salt/minion.d/susemanager.conf
        content: |
          master: suma.5glinux.com
          server_id_use_crc: adler32
          enable_legacy_startup_events: False
          enable_fqdns_grains: False
          grains:
            susemanager:
              activation_key: "1-wordpress"
            role: wordpress
            wordpress:
              url: http://10.0.0.238:30880
    runcmd:
      - hostname > /etc/salt/minion_id
      - zypper -n --gpg-auto-import-keys install salt-minion
      - zypper -n modifyrepo --disable --all
      - '[ -f /etc/zypp/zypp.conf ] || cp /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf'
      - echo 'solver.allowVendorChange = true' >> /etc/zypp/zypp.conf
      - systemctl enable --now salt-minion
