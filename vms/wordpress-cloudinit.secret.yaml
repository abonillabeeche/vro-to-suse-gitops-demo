# First boot of WordPress VMs, delivered by SUSE Virtualization as cloud-init (NoCloud) user data.
# 1. App grains for the Salt state (role, public URL) in the Salt bundle's config directory.
# 2. Package management handed to SUSE Multi-Linux Manager: distribution repos off, vendor change allowed
#    (openSUSE Leap 16.1 consuming the server's SLES 16.1 channels; same code base).
# 3. The server's bootstrap script (mgr-bootstrap --activation-keys=1-wordpress) installs the Salt bundle
#    from the bootstrap repository and registers with activation key 1-wordpress, which assigns the
#    SLES 16.1 channels and the "wordpress" state channel.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-cloudinit
  namespace: vm-demo
type: Opaque
stringData:
  userdata: |
    #cloud-config
    write_files:
      - path: /etc/venv-salt-minion/minion.d/wordpress.conf
        content: |
          grains:
            role: wordpress
            wordpress:
              url: http://10.0.0.238:30880
    runcmd:
      - zypper -n modifyrepo --disable --all
      - '[ -f /etc/zypp/zypp.conf ] || cp /usr/etc/zypp/zypp.conf /etc/zypp/zypp.conf'
      - echo 'solver.allowVendorChange = true' >> /etc/zypp/zypp.conf
      - curl -Sks https://suma.5glinux.com/pub/bootstrap/bootstrap-wordpress.sh | /bin/bash
